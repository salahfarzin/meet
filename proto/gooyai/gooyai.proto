syntax = "proto3";

package gooyai;

import "google/api/annotations.proto";
import "google/protobuf/struct.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "github.com/salahfarzin/meet/proto/gooyai;gooyai";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "Gooyai API";
    version: "1.0";
    description: "Calls and providers from Gooyai, the AI phone receptionist, for clinics connected to it";
    contact: {
      name: "Meets API Support";
      email: "support@meets.example.com";
    };
  };
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  responses: {
    key: "400";
    value: {
      description: "Clinic not connected to Gooyai (FAILED_PRECONDITION), or an invalid filter";
    }
  };
  responses: {
    key: "404";
    value: {
      description: "Resource not found";
    }
  };
  responses: {
    key: "500";
    value: {
      description: "Internal server error";
    }
  };
};

// TranscriptMessage is one turn of the call's conversation.
message TranscriptMessage {
  // role: who spoke, e.g. "assistant" (the AI agent) or "user" (the caller).
  string role = 1;
  string content = 2;
}

// Call is one phone call handled by the clinic's Gooyai AI agent.
message Call {
  // id: Gooyai's call id. A string because the dashboard treats ids as opaque.
  // Unique within a direction, not across directions.
  string id = 1;
  string from_number = 2;
  string to_number = 3;
  // start_at / end_at: RFC3339, UTC.
  string start_at = 4;
  string end_at = 5;
  int32 duration_seconds = 6;
  string recording_url = 7;
  // call_forward: the agent forwarded the call to a person.
  bool call_forward = 8;
  // should_recall_user: the agent flagged that staff should call the caller back.
  bool should_recall_user = 9;
  // transcript: empty when Gooyai returned no transcript or one in an unknown shape.
  repeated TranscriptMessage transcript = 10;
  // analytics: Gooyai's free-form call analytics, e.g. {"sentiment": "neutral", "resolved": true}.
  google.protobuf.Struct analytics = 11;
  // assistant_name: name of the Gooyai agent that answered.
  string assistant_name = 12;
  // direction: "incoming" (a caller rang the clinic) or "outgoing" (the agent
  // rang out). Only incoming calls exist so far.
  string direction = 13;
}

// Provider is a schedulable person in Gooyai. Managed in Gooyai's panel only.
message Provider {
  string id = 1;
  string first_name = 2;
  string last_name = 3;
  string specialty = 4;
  string phone = 5;
  string profile_image_url = 6;
  bool is_active = 7;
}

// Request & Response
message ListCallsRequest {
  // page: 1-based, default 1.
  int32 page = 1;
  // page_size: 1-100, default 20.
  int32 page_size = 2;
  // from / to: inclusive date range, YYYY-MM-DD (Gregorian).
  string from = 3;
  string to = 4;
  // phone: partial match on the caller's number.
  string phone = 5;
  // should_recall: only calls flagged (true) or not flagged (false) for a call back; unset = all.
  optional bool should_recall = 6;
  // organizer_id: superadmins only, to read another clinic's calls. Ignored for everyone else.
  string organizer_id = 7;
  // direction: "incoming" (default when empty) or "outgoing". Outgoing calls
  // aren't available yet and return UNIMPLEMENTED.
  string direction = 8;
}
message ListCallsResponse {
  repeated Call calls = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
  int32 total_pages = 5;
}

// Request & Response
message GetCallRequest {
  string id = 1;
  // organizer_id: superadmins only. Ignored for everyone else.
  string organizer_id = 2;
  // direction: "incoming" (default when empty) or "outgoing"; ids are only
  // unique within a direction.
  string direction = 3;
}

// Connection is a clinic's link to Gooyai. The API key itself is write-only:
// it's stored encrypted and never returned.
message Connection {
  bool connected = 1;
  // environment: "sandbox" or "prod". Empty when not connected.
  string environment = 2;
  // key_last4: last 4 characters of the stored key, to tell keys apart. Empty
  // when not connected or the key is too short to hint at safely.
  string key_last4 = 3;
  // updated_at: when the key was last saved, RFC3339. Empty when not connected.
  string updated_at = 4;
}

// Request & Response
message GetConnectionRequest {
  // organizer_id: superadmins only. Ignored for everyone else.
  string organizer_id = 1;
}

// Request & Response
message SaveConnectionRequest {
  // api_key: the clinic's Gooyai Partner API key. Checked against Gooyai
  // before it's saved.
  string api_key = 1;
  // environment: "sandbox" (default) or "prod".
  string environment = 2;
  // organizer_id: superadmins only. Ignored for everyone else.
  string organizer_id = 3;
}

// Request & Response
message DeleteConnectionRequest {
  // organizer_id: superadmins only. Ignored for everyone else.
  string organizer_id = 1;
}
message DeleteConnectionResponse {
}

// Request & Response
message ListProvidersRequest {
  // organizer_id: superadmins only. Ignored for everyone else.
  string organizer_id = 1;
}
message ListProvidersResponse {
  repeated Provider providers = 1;
}

// Service definition. Registered after MeetService so the literal
// /meets/calls and /meets/phone-assistant routes win over /meets/{uuid}.
service GooyaiService {
  // ListCalls lists incoming calls unless direction says otherwise.
  rpc ListCalls (ListCallsRequest) returns (ListCallsResponse) {
    option (google.api.http) = {
      get: "/meets/calls"
    };
  }
  // GetCall returns the call itself, not wrapped in a response message.
  rpc GetCall (GetCallRequest) returns (Call) {
    option (google.api.http) = {
      get: "/meets/calls/{id}"
    };
  }
  rpc ListProviders (ListProvidersRequest) returns (ListProvidersResponse) {
    option (google.api.http) = {
      get: "/meets/phone-assistant/providers"
    };
  }
  // GetConnection reports whether the clinic is connected; never the key.
  rpc GetConnection (GetConnectionRequest) returns (Connection) {
    option (google.api.http) = {
      get: "/meets/phone-assistant/connection"
    };
  }
  // SaveConnection checks the key against Gooyai, then stores it encrypted,
  // replacing any existing connection.
  rpc SaveConnection (SaveConnectionRequest) returns (Connection) {
    option (google.api.http) = {
      put: "/meets/phone-assistant/connection"
      body: "*"
    };
  }
  rpc DeleteConnection (DeleteConnectionRequest) returns (DeleteConnectionResponse) {
    option (google.api.http) = {
      delete: "/meets/phone-assistant/connection"
    };
  }
}
