syntax = "proto3";

package meets;

import "google/api/annotations.proto";
import "google/protobuf/struct.proto";
import "common/common.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "github.com/salahfarzin/meet/proto/meets;meets";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "Meets API";
    version: "1.0";
    description: "API for managing meetings and appointments";
    contact: {
      name: "Meets API Support";
      email: "support@meets.example.com";
    };
  };
  schemes: HTTP;
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  responses: {
    key: "404";
    value: {
      description: "Resource not found";
    }
  };
  responses: {
    key: "500";
    value: {
      description: "Internal server error";
    }
  };
};

enum MeetType {
  MEET_TYPE_UNSPECIFIED = 0;
  IMMEDIATE_PHONE_CALL = 1;
  CHAT = 2;
  PHONE_CALL = 3;
  VIDEO_CALL = 4;
}

// Meet message
message Meet {
  string uuid = 1;
  string organizer_uuid = 2;
  optional string price_uuid = 3;
  string title = 4;
  string description = 5;
  string color = 6;
  string start = 7;
  string end = 8;
  repeated string participant_uuids = 9;
  MeetType type = 10;
  optional string booked_at = 11;
  // Identity-enriched fields (populated in scheduling list; empty for other endpoints).
  string first_name = 12;
  string last_name = 13;
  string national_code = 14;
  string mobile = 15;
  // clinic_name is the display name of the meet's organizer (clinic/center identity).
  string clinic_name = 16;
  // settings holds admin-workflow state (approved_at, is_absent, present_at) — free-form,
  // owned entirely by the caller (ravanhealth), opaque to this service.
  google.protobuf.Struct settings = 17;
  // created_at exposes the existing meets.created_at column (RFC3339). Read-only: ignored on input.
  string created_at = 18;
  // version is an optimistic-concurrency token. Callers round-trip the value
  // read from GetOne/GetAll back into Update; if the row changed since, Update
  // fails with ABORTED instead of silently clobbering a concurrent write.
  int32 version = 19;
  // creator_uuid is the uuid of the user who created this meet, set explicitly
  // by the caller on Create (organizer_uuid may be a clinic, not the creator,
  // or may fall back to a service-account identity when no clinic is picked).
  // Read-only: ignored on Update.
  string creator_uuid = 20;
}

// Request & Response
message GetOneRequest {
  string uuid = 1;
}
message GetOneResponse {
  Meet meet = 1;
}
// Request & Response
message DeleteRequest {
  string uuid = 1;
}
message DeleteResponse {
}
// Request & Response
message GetAllRequest {
  string organizer_id = 1;
  string from = 2;
  string to = 3;
  string clinic = 4;
  string first_name = 5;
  string last_name = 6;
  string national_id = 7;
  string mobile = 8;
  int32 page = 9;
  int32 page_size = 10;
  // participant_uuid, when set, restricts results to meets where this exact UUID is the
  // (sole) participant — used for "this user's appointment history". Bypasses the identity
  // name/mobile search path entirely.
  string participant_uuid = 11;
}
message GetAllResponse {
  repeated Meet meets = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}
// Request & Response
message CreateRequest {
  Meet meet = 1;
}
message CreateResponse {
  common.ResponseStatus status = 1;
  Meet meet = 2;
}

// Request & Response
message UpdateRequest {
  string uuid = 1;
  Meet meet = 2;
}
message UpdateResponse {
  Meet meet = 1;
}

// Request & Response for availability
message GetAvailabilityRequest {
  string uuid = 1;
  string from = 2; // ISO8601 date string
  string to = 3;   // ISO8601 date string
  optional string price_uuid = 4;
}
message DateSlot {
  string title = 1;
  string label = 2;
  string value = 3;
  repeated TimeSlot times = 4;
}

message TimeSlot {
  string uuid = 1;
  string start = 2;
  string end = 3;
  string duration = 4;
  optional string booked_at = 5;
}

message GetAvailabilityResponse {
  repeated DateSlot dates = 1;
}

// Request & Response for meet types
message GetMeetTypesRequest {
  string uuid = 1;
}
message GetMeetTypesResponse {
  repeated MeetType types = 1;
}

// Service definition
service MeetService {
  rpc GetAll (GetAllRequest) returns (GetAllResponse) {
    option (google.api.http) = {
      get: "/meets"
    };
  }
  rpc GetOne (GetOneRequest) returns (GetOneResponse) {
    option (google.api.http) = {
      get: "/meets/{uuid}"
    };
  }
  rpc Create (CreateRequest) returns (CreateResponse) {
    option (google.api.http) = {
      post: "/meets"
      body: "meet"
    };
  }
  rpc Update (UpdateRequest) returns (UpdateResponse) {
    option (google.api.http) = {
      put: "/meets/{uuid}"
      body: "meet"
    };
  }
  rpc Delete (DeleteRequest) returns (DeleteResponse) {
    option (google.api.http) = {
      delete: "/meets/{uuid}"
    };
  }
  // Get user availability for next 7 days
  rpc GetAvailability (GetAvailabilityRequest) returns (GetAvailabilityResponse) {
    option (google.api.http) = {
      get: "/meets/{uuid}/availability"
    };
  }
  // Get all meet types for an organizer
  rpc GetMeetTypes (GetMeetTypesRequest) returns (GetMeetTypesResponse) {
    option (google.api.http) = {
      get: "/meets/{uuid}/types"
    };
  }
}