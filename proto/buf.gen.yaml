version: v1
plugins:
  - name: go
    out: .
    opt: paths=source_relative
  - name: go-grpc
    out: .
    opt: paths=source_relative
  - name: grpc-gateway
    out: .
    opt: paths=source_relative
  - name: openapiv2
    out: ../pkg/swagger/gen
    strategy: all
    opt:
      - logtostderr=true
      - output_format=yaml
      - json_names_for_fields=false
      - enums_as_ints=true